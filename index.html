<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ژماردەرا تەمەن و دەمی | Age Calculator</title>
    <!-- Tailwind CSS بۆ ڕووکەشەکێ جوان -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- فۆنتێ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-2 text-indigo-400">ژماردەرا تەمەن و دەمی</h1>
        <p class="text-slate-400 text-center text-sm mb-6">ڕۆژا ژدایکبوونا خۆ دیار بکە دا تەمەنێ خۆ ب سال، هەيف، روژ، دەمژمێر و چرکە ببینی.</p>

        <!-- پشکا دەستپێکێ (Input) -->
        <div class="mb-5">
            <label class="block text-sm font-medium text-slate-300 mb-2">روژ و دەمێ ژدایکبوونێ:</label>
            <input type="datetime-local" id="birthDate" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <button onclick="startCalculator()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30">
            تەمەمێ من دياربكه (ئۆتۆماتیکی)
        </button>

        <!-- پشکا ئەنجامی (Results) -->
        <div id="result" class="mt-6 hidden space-y-2 bg-slate-900/50 p-4 rounded-xl border border-slate-700/50 text-center">
            <div class="grid grid-cols-3 gap-2">
                <div class="bg-slate-800 p-2 rounded-lg">
                    <span id="years" class="text-lg font-bold text-indigo-400 block">0</span>
                    <span class="text-xs text-slate-400">سال</span>
                </div>
                <div class="bg-slate-800 p-2 rounded-lg">
                    <span id="months" class="text-lg font-bold text-indigo-400 block">0</span>
                    <span class="text-xs text-slate-400">هەيف</span>
                </div>
                <div class="bg-slate-800 p-2 rounded-lg">
                    <span id="days" class="text-lg font-bold text-indigo-400 block">0</span>
                    <span class="text-xs text-slate-400">روژ</span>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-2 mt-2">
                <div class="bg-slate-800 p-2 rounded-lg">
                    <span id="hours" class="text-base font-bold text-indigo-400 block">0</span>
                    <span class="text-xs text-slate-400">دەمژمێر</span>
                </div>
                <div class="bg-slate-800 p-2 rounded-lg">
                    <span id="minutes" class="text-base font-bold text-indigo-400 block">0</span>
                    <span class="text-xs text-slate-400">خولەک</span>
                </div>
                <div class="bg-slate-800 p-2 rounded-lg">
                    <span id="seconds" class="text-base font-bold text-indigo-400 block">0</span>
                    <span class="text-xs text-slate-400">چرکە</span>
                </div>
            </div>
        </div>
    </div>

    <!-- پشکا JavaScript بۆ لۆجیکێ ئۆتۆماتیکی -->
    <script>
        let timer = null;

        function startCalculator() {
            const birthInput = document.getElementById('birthDate').value;
            if (!birthInput) {
                alert('هيڤي دكەم روژ و دەمێ ژدایکبوونا خۆ دیار بکە!');
                return;
            }

            const birthDate = new Date(birthInput);

            // ئەگەر دەمێ مە بەری نوو هەبیت، پاک دکەین دا دوو جار لێک نەدەن
            if (timer) clearInterval(timer);

            function updateAge() {
                const now = new Date();
                let diff = now - birthDate;

                if (diff < 0) {
                    alert('روژا ژدایکبوونێ نابی پاش داهاتوویێ بیت!');
                    clearInterval(timer);
                    return;
                }

                // ژمارتنا سال، هەيف، روژ، دەمژمێر، خولەک و چرکە
                let years = now.getFullYear() - birthDate.getFullYear();
                let months = now.getMonth() - birthDate.getMonth();
                let days = now.getDate() - birthDate.getDate();
                let hours = now.getHours() - birthDate.getHours();
                let minutes = now.getMinutes() - birthDate.getMinutes();
                let seconds = now.getSeconds() - birthDate.getSeconds();

                if (seconds < 0) {
                    seconds += 60;
                    minutes--;
                }
                if (minutes < 0) {
                    minutes += 60;
                    hours--;
                }
                if (hours < 0) {
                    hours += 24;
                    days--;
                }
                if (days < 0) {
                    months--;
                    const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                    days += prevMonth.getDate();
                }
                if (months < 0) {
                    years--;
                    months += 12;
                }

                // نیشاندانا ئەنجامی ل سەر شاشەیێ
                document.getElementById('years').innerText = years;
                document.getElementById('months').innerText = months;
                document.getElementById('days').innerText = days;
                document.getElementById('hours').innerText = hours;
                document.getElementById('minutes').innerText = minutes;
                document.getElementById('seconds').innerText = seconds;
                document.getElementById('result').classList.remove('hidden');
            }

            updateAge();
            // نووکرنا ئۆتۆماتیکی هەمی 1 چرکە (1000 ms)
            timer = setInterval(updateAge, 1000);
        }
    </script>
</body>
</html>
