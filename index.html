<!DOCTYPE html>
<html lang="kmr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age & Time</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
            width: 320px;
        }
        h2 { color: #e50914; margin-bottom: 15px; }
        .clock {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #f39c12;
        }
        input {
            padding: 10px;
            width: 90%;
            border-radius: 5px;
            border: none;
            margin-bottom: 15px;
        }
        button {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .result {
            margin-top: 15px;
            font-size: 16px;
            color: #2ecc71;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Age & Time</h2>
        <div class="clock" id="clock">00:00:00</div>

        <input type="date" id="birthdate">
        <button onclick="calculate()">تەمەنێ من بژمێرە</button>

        <div class="result" id="result"></div>
    </div>

    <script>
        // Live Time
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Age Calculation
        function calculate() {
            const val = document.getElementById('birthdate').value;
            if(!val) return;

            const birth = new Date(val);
            const today = new Date();
            let age = today.getFullYear() - birth.getFullYear();
            const m = today.getMonth() - birth.getMonth();

            if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) {
                age--;
            }

            document.getElementById('result').innerText = "تەمەنێ تە: " + age + " ساڵن";
        }
    </script>
</body>
</html>
