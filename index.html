<script>
    // تژی کرنا سالان ژ سالا 1920 هەتا سالا نها
    const yearSelect = document.getElementById('year');
    const currentYear = new Date().getFullYear();
    for (let y = currentYear; y >= 1920; y--) {
        let option = document.createElement('option');
        option.value = y;
        option.textContent = y;
        yearSelect.appendChild(option);
    }

    // تژی کرنا روژان ژ 1 هەتا 31
    const daySelect = document.getElementById('day');
    for (let d = 1; d <= 31; d++) {
        let option = document.createElement('option');
        option.value = d;
        option.textContent = d;
        daySelect.appendChild(option);
    }

    // فەنکشن بۆ ژمارکرنا عەمری و زێدەبوونا وێ
    function calculateAge() {
        const birthYear = parseInt(document.getElementById('year').value);
        const birthMonth = parseInt(document.getElementById('month').value) - 1;
        const birthDay = parseInt(document.getElementById('day').value);

        const today = new Date();
        const currentYear = today.getFullYear();
        const currentMonth = today.getMonth();
        const currentDay = today.getDate();

        let ageYears = currentYear - birthYear;
        let ageMonths = currentMonth - birthMonth;
        let ageDays = currentDay - birthDay;

        if (ageDays < 0) {
            ageMonths--;
            const lastMonthDate = new Date(currentYear, currentMonth, 0);
            ageDays += lastMonthDate.getDate();
        }

        if (ageMonths < 0) {
            ageYears--;
            ageMonths += 12;
        }

        // حیسابکرنا چەند روژ و مەهـ ماینە هەتا سالا تە یا ل دووڤ دا تەواو ببیت
        // بۆ نموونە هەتا تەمەنێ تە دبە سالا ل دووڤ دا (ageYears + 1)
        let nextBirthdayYear = birthYear + ageYears + 1;
        let nextBirthday = new Date(nextBirthdayYear, birthMonth, birthDay);
        
        let diffTime = nextBirthday - today;
        let diffDaysTotal = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        let remainingMonths = Math.floor(diffDaysTotal / 30);
        let remainingDays = diffDaysTotal % 30;

        // نیشاندانا ئەنجامی ب زێدەبوونا مەیێن پاشەڕۆژێ ڤە
        let message = "تەمەنێ تە یێ نها:\n" + ageYears + " سال، " + ageMonths + " هەیف، " + ageDays + " روژ\n\n" +
                      "دێ چەند بۆ تە زێدە بیت بۆ سالا ل دووڤ دا؟\n" +
                      "مایە: " + remainingMonths + " هەیف و " + remainingDays + " روژ هەتا تەمەنێ تە پتر لێ بێت!";

        alert(message);
    }
</script>
