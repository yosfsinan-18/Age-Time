<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ژماردەرا تەمەنی | Age Calculator</title>
    <!-- Tailwind CSS بۆ ڕووکەشەکێ جوان -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- فۆنتێ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-2 text-indigo-400">ژماردەرا تەمەن و دەمی</h1>
        <p class="text-slate-400 text-center text-sm mb-6">ڕۆژا ژدایکبوونا خۆ دیار بکە دا تەمەنێ خۆ ب سال، مەه و رۆژ ببینن.</p>

        <!-- پشکا دەستپێکێ (Input) -->
        <div class="mb-5">
            <label class="block text-sm font-medium text-slate-300 mb-2">ڕۆژا ژدایکبوونێ:</label>
            <input type="date" id="birthDate" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <button onclick="calculateAge()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30">
            تەمەمێ من ببژێرە
        </button>

        <!-- پشکا ئەنجامی (Results) -->
        <div id="result" class="mt-6 hidden space-y-3 bg-slate-900/50 p-4 rounded-xl border border-slate-700/50">
            <div class="flex justify-between items-center">
                <span class="text-slate-400">سال:</span>
                <span id="years" class="text-xl font-bold text-indigo-400">0</span>
            </div>
            <hr class="border-slate-800">
            <div class="flex justify-between items-center">
                <span class="text-slate-400">مەه:</span>
                <span id="months" class="text-xl font-bold text-indigo-400">0</span>
            </div>
            <hr class="border-slate-800">
            <div class="flex justify-between items-center">
                <span class="text-slate-400">ڕۆژ:</span>
                <span id="days" class="text-xl font-bold text-indigo-400">0</span>
            </div>
        </div>
    </div>

    <!-- پشکا JavaScript بۆ لۆجیکێ -->
    <script>
        function calculateAge() {
            const birthInput = document.getElementById('birthDate').value;
            if (!birthInput) {
                alert('هیڤیدە ڕوژا ژدایکبوونا خۆ دیار بکە!');
                return;
            }

            const birthDate = new Date(birthInput);
            const today = new Date();

            let years = today.getFullYear() - birthDate.getFullYear();
            let months = today.getMonth() - birthDate.getMonth();
            let days = today.getDate() - birthDate.getDate();

            if (days < 0) {
                months--;
                // وەرگرتنا ژمارا ڕۆژێن مەها بوری
                const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += prevMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            // نیشاندانا ئەنجامی
            document.getElementById('years').innerText = years;
            document.getElementById('months').innerText = months;
            document.getElementById('days').innerText = days;
            document.getElementById('result').classList.remove('hidden');
        }
    </script>
</body>
</html>
